name: Verify Posiran ERP and Dispatch Release
on:
  push:
    branches: [ posiran_test, posiran_production ]
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: posiran-public-release-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify-and-dispatch:
    runs-on: [self-hosted, Windows, X64, erp-server]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Verify white-label
        shell: powershell
        run: |
          foreach($p in @('Ecomm\wwwroot\posiran-brand.css','Ecomm\wwwroot\img\posiran-logo.svg')){if(!(Test-Path $p)){throw "Missing Posiran asset $p"}}
          $css=Get-Content 'Ecomm\wwwroot\posiran-brand.css' -Raw;if($css -notmatch 'پوزایران ERP' -or $css -notmatch 'posiran\.ir'){throw 'Posiran brand contract invalid'}
      - run: dotnet restore Ecomm.sln
      - run: dotnet build Ecomm.sln -c Release --no-restore
      - run: dotnet test Ecomm.Tests\Ecomm.Tests.csproj -c Release --no-build --verbosity normal
      - name: Dispatch verified SHA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_REPO_TOKEN }}
          script: |
            const branch=context.ref.replace('refs/heads/','');
            if(!['posiran_test','posiran_production'].includes(branch)){core.setFailed(`Unsupported branch ${branch}`);return;}
            await github.rest.repos.createDispatchEvent({owner:'alimirzae',repo:'iMonitor-Erp-Releases',event_type:'posiran-erp-release',client_payload:{source_repo:context.repo.owner+'/'+context.repo.repo,branch,sha:context.sha,run_id:String(context.runId),run_number:String(context.runNumber)}});
