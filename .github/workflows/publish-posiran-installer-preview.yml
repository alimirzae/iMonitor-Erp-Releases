name: Publish Unified ERP Deployment Manager

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'installer/PosiranERP.Installer.Web/**'
      - '.github/workflows/publish-posiran-installer-preview.yml'

permissions:
  contents: write

concurrency:
  group: erp-deployment-manager
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained setup host
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'erp-deployment-manager'
          dotnet publish installer\PosiranERP.Installer.Web\PosiranERP.Installer.Web.csproj `
            -c Release -r win-x64 --self-contained true -o $out
          if($LASTEXITCODE -ne 0){throw 'Installer publish failed'}
          if(!(Test-Path (Join-Path $out 'PosiranERP.Setup.exe'))){throw 'PosiranERP.Setup.exe missing'}
          @'
          @echo off
          cd /d "%~dp0"
          start "ERP Deployment Manager" "PosiranERP.Setup.exe"
          timeout /t 2 /nobreak >nul
          start "" "http://127.0.0.1:8099/"
          '@ | Set-Content (Join-Path $out 'Start-ERP-Deployment-Manager.cmd') -Encoding ASCII

      - name: Package preview
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'erp-deployment-manager'
          $zip=Join-Path $env:RUNNER_TEMP 'ERP-Deployment-Manager-win-x64.zip'
          Compress-Archive -Path "$out\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ERP-Deployment-Manager-win-x64.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          "SETUP_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_SHA=$zip.sha256" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: erp-deployment-manager
          name: ERP Deployment Manager
          body: |
            Persistent localhost-only Windows x64 ERP Deployment Manager for Posiran and iMonitor ERP.
            Bootstrap installs ERP Deployment Manager as an automatic Windows Service.
            Manager listens only on http://127.0.0.1:8099/.
            Preview channel.
          target_commitish: main
          prerelease: true
          make_latest: false
          files: |
            ${{ env.SETUP_ZIP }}
            ${{ env.SETUP_SHA }}

      - name: Verify published release asset hashes from GitHub metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $archive=$env:SETUP_ZIP
          $checksum=$env:SETUP_SHA
          $localZip=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=((Get-Content $checksum -Raw).Trim() -split '\\s+')[0].ToLowerInvariant()
          if($localZip -ne $expected){throw "Generated ZIP hash does not match checksum file"}
          $localSha=(Get-FileHash $checksum -Algorithm SHA256).Hash.ToLowerInvariant()
          $release=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/erp-deployment-manager" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Release metadata request failed'}
          $zipAsset=@($release.assets | Where-Object name -eq 'ERP-Deployment-Manager-win-x64.zip')
          $shaAsset=@($release.assets | Where-Object name -eq 'ERP-Deployment-Manager-win-x64.zip.sha256')
          if($zipAsset.Count -ne 1 -or $shaAsset.Count -ne 1){throw 'Release asset pair missing or ambiguous'}
          if($zipAsset[0].digest -ne "sha256:$localZip"){throw "Published ZIP digest mismatch: $($zipAsset[0].digest) vs sha256:$localZip"}
          if($shaAsset[0].digest -ne "sha256:$localSha"){throw "Published checksum digest mismatch: $($shaAsset[0].digest) vs sha256:$localSha"}
          Write-Host "Release asset digests match generated ZIP and checksum: $localZip"
