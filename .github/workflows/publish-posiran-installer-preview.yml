name: Publish Posiran Installer Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'installer/PosiranERP.Installer.Web/**'
      - '.github/workflows/publish-posiran-installer-preview.yml'

permissions:
  contents: write

concurrency:
  group: posiran-installer-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained setup host
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'posiran-installer'
          dotnet publish installer\PosiranERP.Installer.Web\PosiranERP.Installer.Web.csproj `
            -c Release -r win-x64 --self-contained true -o $out
          if($LASTEXITCODE -ne 0){throw 'Installer publish failed'}
          if(!(Test-Path (Join-Path $out 'PosiranERP.Setup.exe'))){throw 'PosiranERP.Setup.exe missing'}
          @'
          @echo off
          cd /d "%~dp0"
          start "Posiran ERP Setup" "PosiranERP.Setup.exe"
          timeout /t 2 /nobreak >nul
          start "" "http://127.0.0.1:8099/"
          '@ | Set-Content (Join-Path $out 'Start-PosiranERP-Setup.cmd') -Encoding ASCII

      - name: Package preview
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'posiran-installer'
          $zip=Join-Path $env:RUNNER_TEMP 'PosiranERP-Setup-win-x64.zip'
          Compress-Archive -Path "$out\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PosiranERP-Setup-win-x64.zip" | Set-Content "$zip.sha256" -Encoding ASCII

      - name: Replace preview release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='posiran-installer-preview'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag}
          $zip=Join-Path $env:RUNNER_TEMP 'PosiranERP-Setup-win-x64.zip'
          gh release create $tag $zip "$zip.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target main `
            --title 'Posiran ERP Setup Preview' `
            --notes 'Self-contained Windows x64 setup host. Run Start-PosiranERP-Setup.cmd or PosiranERP.Setup.exe as Administrator. Wizard: http://127.0.0.1:8099/. Preview channel.' `
            --prerelease
          if($LASTEXITCODE -ne 0){throw 'Preview release creation failed'}
