name: Publish iMonitor Platform Linux Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-imonitor-platform.yml'
      - 'manifests/imonitor-platform-release.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imonitor-platform-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read release manifest
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.release_version' manifests/imonitor-platform-release.json)
          TAG=$(jq -r '.release_tag' manifests/imonitor-platform-release.json)
          SOURCE_REPO=$(jq -r '.source_repository' manifests/imonitor-platform-release.json)
          SOURCE_REF=$(jq -r '.source_ref' manifests/imonitor-platform-release.json)
          INSTALLER_PATH=$(jq -r '.installer_path' manifests/imonitor-platform-release.json)
          UPDATER_PATH=$(jq -r '.updater_path' manifests/imonitor-platform-release.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "installer_path=$INSTALLER_PATH" >> "$GITHUB_OUTPUT"
          echo "updater_path=$UPDATER_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve and download iMonitor source
        id: source
        shell: bash
        env:
          SOURCE_REPO: ${{ steps.meta.outputs.source_repo }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${SOURCE_REPO}/commits/${SOURCE_REF}" | jq -r '.sha')
          test -n "$SHA" && test "$SHA" != null
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p work/source/iMonitor-Platform
          curl -fL --retry 5 "https://github.com/${SOURCE_REPO}/archive/${SHA}.tar.gz" -o work/source.tar.gz
          tar -xzf work/source.tar.gz -C work/source/iMonitor-Platform --strip-components=1
          printf '%s\n' "$SHA" > work/source/iMonitor-Platform/RELEASE_SOURCE_SHA
          printf '%s\n' "$VERSION" > work/source/iMonitor-Platform/RELEASE_VERSION

      - name: Build all Docker images
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd work/source/iMonitor-Platform
          export COMPOSE_PROJECT_NAME=imonitor
          docker compose build
          docker pull mysql:8.0
          docker pull redis:7-alpine
          docker pull nginx:alpine
          mapfile -t CUSTOM < <(docker compose images --format json | jq -r 'select(.Repository != null and .Repository != "") | .Repository + ":" + .Tag' | sort -u)
          IMAGES=("${CUSTOM[@]}" mysql:8.0 redis:7-alpine nginx:alpine)
          printf '%s\n' "${IMAGES[@]}" | sort -u > ../../docker-images.txt
          docker image save $(cat ../../docker-images.txt) | gzip -1 > ../../iMonitor-Platform-docker-images-v${VERSION}.tar.gz

      - name: Package source and release metadata
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPO: ${{ steps.meta.outputs.source_repo }}
          INSTALLER_PATH: ${{ steps.meta.outputs.installer_path }}
          UPDATER_PATH: ${{ steps.meta.outputs.updater_path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/iMonitor-Platform-source-v${VERSION}.tar.gz" -C work/source iMonitor-Platform
          mv "work/iMonitor-Platform-docker-images-v${VERSION}.tar.gz" dist/
          cp "$INSTALLER_PATH" "dist/Install-iMonitorPlatform-v1.0.0.sh"
          cp "$UPDATER_PATH" "dist/Update-iMonitorPlatform-v1.0.0.sh"
          cat > dist/manifest.json <<EOF
          {
            "product": "iMonitor Platform",
            "version": "${VERSION}",
            "tag": "${TAG}",
            "source_repository": "${SOURCE_REPO}",
            "source_sha": "${SOURCE_SHA}",
            "architecture": "linux-amd64",
            "source_asset": "iMonitor-Platform-source-v${VERSION}.tar.gz",
            "docker_images_asset": "iMonitor-Platform-docker-images-v${VERSION}.tar.gz",
            "installer": "Install-iMonitorPlatform-v1.0.0.sh",
            "updater": "Update-iMonitorPlatform-v1.0.0.sh"
          }
          EOF
          (cd dist && sha256sum iMonitor-Platform-source-v${VERSION}.tar.gz iMonitor-Platform-docker-images-v${VERSION}.tar.gz Install-iMonitorPlatform-v1.0.0.sh Update-iMonitorPlatform-v1.0.0.sh manifest.json > "SHA256SUMS-v${VERSION}.txt")

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # iMonitor Platform v${VERSION}

          نصب یک‌مرحله‌ای کل سامانه iMonitor روی Ubuntu/Debian Linux با Docker Compose.

          **Source SHA:** \`${SOURCE_SHA}\`

          این انتشار شامل سورس نسخه ثابت، Docker imageهای از پیش ساخته‌شده، MySQL، Redis و Nginx موردنیاز در image bundle، SHA-256 و Installer/Updater نسخه‌دار است.

          نصب:
          \`curl -fsSL https://raw.githubusercontent.com/alimirzae/iMonitor-Erp-Releases/main/scripts/Install-iMonitorPlatform-v1.0.0.sh | sudo bash\`

          پس از نصب، updater هر ۳۰ دقیقه GitHub Releases را بررسی و نسخه جدیدتر iMonitor Platform را خودکار نصب می‌کند.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" dist/* --title "iMonitor Platform v${VERSION}" --notes-file release-notes.md --latest --target "$GITHUB_SHA"
          fi
