name: Publish iMonitor ERP Installer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/Install-iMonitorERP-v2.1.5.ps1'
      - 'scripts/Start-iMonitorERP-Setup.ps1'
      - 'scripts/Install-PosiranERP-v1.0.5.ps1'
      - 'installer/iMonitorERP.Installer.Web/**'
      - '.github/workflows/publish-imonitor-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-imonitor-erp-installer-v2.1.5
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'scripts/Install-iMonitorERP-v2.1.5.ps1',
            'scripts/Start-iMonitorERP-Setup.ps1',
            'scripts/Install-PosiranERP-v1.0.5.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Error $_};throw "Syntax validation failed: $file"}
          }

      - name: Build iMonitor web setup host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'imonitor-installer-web'
          dotnet publish installer\iMonitorERP.Installer.Web\iMonitorERP.Installer.Web.csproj -c Release -r win-x64 --self-contained true -o $out
          if($LASTEXITCODE -ne 0){throw 'iMonitor Setup Host publish failed'}
          if(!(Test-Path (Join-Path $out 'iMonitorERP.Setup.exe'))){throw 'iMonitorERP.Setup.exe missing'}
          $zip=Join-Path $env:RUNNER_TEMP 'iMonitorERP-Setup-win-x64.zip'
          Compress-Archive -Path "$out\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  iMonitorERP-Setup-win-x64.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          "SETUP_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_SHA=$zip.sha256" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish fixed installer release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tag='imonitor-erp-installer-v2.1.5'
          $assets=@(
            'scripts/Install-iMonitorERP-v2.1.5.ps1',
            'scripts/Start-iMonitorERP-Setup.ps1'
          )
          $exists=$false
          $oldPreference=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if($LASTEXITCODE -eq 0){$exists=$true}
          $global:LASTEXITCODE=0
          $ErrorActionPreference=$oldPreference
          if($exists){
            & gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          }else{
            & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target main --title 'iMonitor ERP Installer 2.1.5' --notes 'Bootstrap and installer without dependency on raw.githubusercontent.com. Includes channel-aware Test/Production installation, verified package cache, rollback, health check, and scheduled self-update.'
          }
          if($LASTEXITCODE -ne 0){throw 'Installer release publication failed.'}

          $preview='imonitor-installer-preview'
          $previewAssets=@($env:SETUP_ZIP,$env:SETUP_SHA)
          $previewExists=$false
          $oldPreference=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          & gh release view $preview --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if($LASTEXITCODE -eq 0){$previewExists=$true}
          $global:LASTEXITCODE=0
          $ErrorActionPreference=$oldPreference
          if($previewExists){
            & gh release upload $preview @previewAssets --clobber --repo $env:GITHUB_REPOSITORY
          }else{
            & gh release create $preview @previewAssets --repo $env:GITHUB_REPOSITORY --target main --title 'iMonitor ERP Setup Preview' --prerelease --notes 'Self-contained web setup host on http://127.0.0.1:8099/.'
          }
          if($LASTEXITCODE -ne 0){throw 'iMonitor web setup publication failed.'}

          $posiranTag='posiran-erp-installer-v1.0.5'
          $posiranAsset='scripts/Install-PosiranERP-v1.0.5.ps1'
          $posiranExists=$false
          $oldPreference=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          & gh release view $posiranTag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if($LASTEXITCODE -eq 0){$posiranExists=$true}
          $global:LASTEXITCODE=0
          $ErrorActionPreference=$oldPreference
          if($posiranExists){
            & gh release upload $posiranTag $posiranAsset --clobber --repo $env:GITHUB_REPOSITORY
          }else{
            & gh release create $posiranTag $posiranAsset --repo $env:GITHUB_REPOSITORY --target main --title 'Posiran ERP Installer 1.0.5' --notes 'Channel-aware installer with verified package cache, staged deployment, rollback, health check and scheduled self-update.'
          }
          if($LASTEXITCODE -ne 0){throw 'Posiran installer release publication failed.'}
