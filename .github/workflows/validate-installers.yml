name: Validate Public Installers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'drivers/**'
      - '.github/workflows/validate-installers.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize bootstrap scripts
        shell: pwsh
        run: |
          $edge='scripts/Install-iMonitorEdge.ps1'
          $text=Get-Content $edge -Raw
          $text=$text.Replace('$json | Add-Member ApplicationSettings ([pscustomobject]@{})', '$json | Add-Member -NotePropertyName ApplicationSettings -NotePropertyValue ([pscustomobject]@{})')
          Set-Content $edge $text -Encoding UTF8

          $branch='scripts/Install-iMonitorBranch.ps1'
          $text=Get-Content $branch -Raw
          $text=$text.Replace('$json | Add-Member Deployment ([pscustomobject]@{})', '$json | Add-Member -NotePropertyName Deployment -NotePropertyValue ([pscustomobject]@{})')
          $text=$text.Replace('"IIS AppPool\$pool:(OI)(CI)RX"', '"IIS AppPool\${pool}:(OI)(CI)RX"')
          Set-Content $branch $text -Encoding UTF8

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed=$false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $failed=$true
              Write-Host "Parser errors in $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if($failed){exit 1}

      - name: Reconstruct and verify Behpardakht POS-PC 1.4.48
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'pcpos-driver-validation'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          New-Item -ItemType Directory -Force $root | Out-Null
          & ./scripts/Ensure-BehpardakhtPosPcDriver.ps1 -TargetRoot $root
          $dll=Join-Path $root 'DeviceDrivers\pos\behpardakht-pospc-1.4.48\POS_PC.dll'
          if(!(Test-Path $dll)){throw 'Reconstructed POS_PC.dll is missing.'}
          $sha=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'f691da423cae1052f3c867a327109d18117128ee24098ae4aefa13408e52d5b6'){throw "Unexpected POS_PC SHA256: $sha"}
          $version=[Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          if(-not $version.StartsWith('1.4.48')){throw "Unexpected POS_PC version: $version"}
          if((Get-Item $dll).Length -ne 95232){throw "Unexpected POS_PC size: $((Get-Item $dll).Length)"}
          Write-Host "[OK] POS_PC.dll $version / $sha / 95232 bytes"

      - name: Validate standalone iMonitor installer contract
        shell: pwsh
        run: |
          $path='scripts/Install-iMonitorERP-v2.1.6.ps1'
          $text=Get-Content $path -Raw
          $required=@(
            "`$asset='iMonitor-EcomERP-win-x64.zip'",
            "'Global\iMonitorERP-Installer-v2'",
            "Database=if(`$isTest){'ecomm_dev'}else{'ecomm'}",
            "MigrateOnStartup' `$true",
            "[string]`$TestHostHeader",
            "[string]`$ProductionHostHeader"
          )
          foreach($needle in $required){if(!$text.Contains($needle)){throw "Standalone installer contract missing: $needle"}}
          if($text -match '(?i)posiran'){throw 'Posiran branding leaked into the iMonitor installer.'}
          if(!$text.Contains("Update-iMonitorERP.ps1")){throw 'Local iMonitor updater is not generated in the active installation root.'}
          if(!$text.Contains("release-tag.txt")){throw 'iMonitor installer does not persist the installed release tag.'}
          if(!$text.Contains("Install-iMonitorERP.ps1")){throw 'iMonitor installer is not carried into the active installation root.'}
          if($text.Contains('https://127.0.0.1') -or $text.Contains('$httpsUrl=$healthUrl')){throw 'HTTPS loopback fallback must not return to the iMonitor installer.'}

          $posiran='scripts/Install-PosiranERP-v1.0.5.ps1'
          $posiranText=Get-Content $posiran -Raw
          if(!$posiranText.Contains("Update-PosiranERP.ps1")){throw 'Local Posiran updater is not generated in the active installation root.'}
          if(!$posiranText.Contains("release-tag.txt")){throw 'Posiran installer does not persist the installed release tag.'}
          if(!$posiranText.Contains("Install-PosiranERP.ps1")){throw 'Posiran installer is not carried into the active installation root.'}

      - name: Commit normalization if needed
        shell: pwsh
        run: |
          git config user.name 'iMonitor Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add scripts
          if(git diff --cached --quiet){ exit 0 }
          git commit -m 'fix: normalize public PowerShell installers'
          git pull --rebase origin main
          git push origin HEAD:main
