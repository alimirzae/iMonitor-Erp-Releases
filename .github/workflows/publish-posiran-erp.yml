name: Publish Posiran ERP Windows Release

on:
  repository_dispatch:
    types: [posiran-erp-release]

permissions:
  contents: write

concurrency:
  group: posiran-erp-release-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

jobs:
  package-and-release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: alimirzae/Ecomm
      SOURCE_SHA: ${{ github.event.client_payload.sha }}
      SOURCE_BRANCH: ${{ github.event.client_payload.branch }}
      SOURCE_RUN_NUMBER: ${{ github.event.client_payload.run_number }}
      ASSET_NAME: PosiranERP-win-x64.zip
    steps:
      - name: Validate payload
        shell: powershell
        run: |
          if($env:SOURCE_BRANCH -notin @('posiran_test','posiran_production')){throw "Unsupported branch: $env:SOURCE_BRANCH"}
          if($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$'){throw 'Invalid SHA'}
          if($env:SOURCE_RUN_NUMBER -notmatch '^\d+$'){throw 'Invalid run number'}

      - name: Checkout exact verified Posiran commit
        uses: actions/checkout@v4
        with:
          repository: alimirzae/Ecomm
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          path: EcommSource
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Posiran white-label overlay
        shell: powershell
        run: |
          $root="$env:GITHUB_WORKSPACE\EcommSource"
          foreach($p in @('Ecomm\wwwroot\posiran-brand.css','Ecomm\wwwroot\img\posiran-logo.svg')){
            if(!(Test-Path (Join-Path $root $p))){throw "Missing Posiran asset: $p"}
          }
          $css=Get-Content (Join-Path $root 'Ecomm\wwwroot\posiran-brand.css') -Raw
          if($css -notmatch 'پوزایران ERP'){throw 'Package is not branded as Posiran ERP'}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish clean Windows package
        shell: powershell
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\EcommSource"
          dotnet restore Ecomm\Ecomm.csproj -r win-x64
          if($LASTEXITCODE -ne 0){throw 'Restore failed'}
          $out=Join-Path $env:RUNNER_TEMP 'posiran-publish'
          dotnet publish Ecomm\Ecomm.csproj -c Release -r win-x64 --self-contained false --no-restore -o $out
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          foreach($f in @('appsettings.json','appsettings.Development.json','appsettings.Production.json')){
            $p=Join-Path $out $f; if(Test-Path $p){Remove-Item $p -Force}
          }
          if(!(Test-Path (Join-Path $out 'Ecomm.dll'))){throw 'Ecomm.dll missing'}
          if(!(Test-Path (Join-Path $out 'wwwroot\posiran-brand.css'))){throw 'Posiran branding missing from package'}
          if(!(Test-Path (Join-Path $out 'wwwroot\img\posiran-logo.svg'))){throw 'Posiran logo missing from package'}

      - name: Zip and checksum
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'posiran-publish'
          $zip=Join-Path $env:RUNNER_TEMP $env:ASSET_NAME
          Compress-Archive -Path "$out\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content "$zip.sha256" -Encoding ASCII

      - name: Create Posiran release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $isTest=$env:SOURCE_BRANCH -eq 'posiran_test'
          $channel=if($isTest){'test'}else{'production'}
          $version="1.0.$env:SOURCE_RUN_NUMBER"
          $tag="posiran-erp-$channel-v$version"
          $title="Posiran ERP $channel $version"
          $notes="Posiran ERP $channel Windows x64 release. Source branch: $env:SOURCE_BRANCH; verified source SHA: $env:SOURCE_SHA. Application settings are intentionally excluded from the package so Posiran channel configuration remains isolated."
          $zip=Join-Path $env:RUNNER_TEMP $env:ASSET_NAME
          $args=@('release','create',$tag,$zip,"$zip.sha256",'--repo',$env:GITHUB_REPOSITORY,'--target','main','--title',$title,'--notes',$notes)
          if($isTest){$args+='--prerelease'}
          & gh @args
          if($LASTEXITCODE -ne 0){throw 'Posiran release creation failed'}
          "channel=$channel`nversion=$version`nsource=$env:SOURCE_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
