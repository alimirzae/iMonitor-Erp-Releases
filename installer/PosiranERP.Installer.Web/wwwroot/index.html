<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>راه‌اندازی ERP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182230;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:980px;margin:32px auto;padding:18px}.card{background:#fff;border:1px solid #e4e9f0;border-radius:20px;box-shadow:0 18px 55px rgba(22,34,51,.08);overflow:hidden}.head{padding:26px 30px;background:linear-gradient(135deg,#102d5b,#176fa5);color:#fff}.head h1{margin:0 0 7px}.body{padding:28px 30px}.status{padding:13px 15px;border-radius:12px;background:#eef7fb;margin-bottom:20px;white-space:pre-wrap}.ok{background:#eaf8ef}.warn{background:#fff4e5}.products{display:grid;grid-template-columns:1fr 1fr;gap:14px}.target{border:1px solid #dce5ee;border-radius:14px;padding:16px}.target h3{margin:0 0 12px}.row{display:flex;gap:10px;align-items:center;margin-bottom:10px}.row input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}input{width:100%;padding:10px;border:1px solid #ccd5df;border-radius:9px;font:inherit}.db{margin-top:18px;padding-top:18px;border-top:1px solid #e5eaf0}.actions{margin-top:20px;display:flex;gap:10px}button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#116f9f;color:white}.summary{margin-top:18px;line-height:1.9}.hidden{display:none}@media(max-width:720px){.products,.grid{grid-template-columns:1fr}.wrap{margin:0;padding:0}.card{border-radius:0}}
</style></head><body><div class="wrap"><div class="card"><div class="head"><h1>راه‌اندازی یکپارچه ERP</h1><p>نصب و ارتقای Posiran ERP و iMonitor ERP از یک صفحه</p></div><div class="body">
<div id="status" class="status">در حال بررسی سیستم...</div>
<div class="products">
<div class="target"><div class="row"><input id="pt" type="checkbox" checked><h3>Posiran Test</h3></div><div class="grid"><div><label>پورت</label><input id="ptPort" type="number" value="8082"></div><div><label>دیتابیس</label><input id="ptDb" value="posiran_test" dir="ltr"></div></div></div>
<div class="target"><div class="row"><input id="pp" type="checkbox"><h3>Posiran Production</h3></div><div class="grid"><div><label>پورت</label><input id="ppPort" type="number" value="8083"></div><div><label>دیتابیس</label><input id="ppDb" value="posiran" dir="ltr"></div></div></div>
<div class="target"><div class="row"><input id="it" type="checkbox"><h3>iMonitor Test</h3></div><div class="grid"><div><label>پورت</label><input id="itPort" type="number" value="8081"></div><div><label>دیتابیس</label><input id="itDb" value="ecomm_dev" dir="ltr"></div></div></div>
<div class="target"><div class="row"><input id="ip" type="checkbox"><h3>iMonitor Production</h3></div><div class="grid"><div><label>پورت</label><input id="ipPort" type="number" value="8080"></div><div><label>دیتابیس</label><input id="ipDb" value="ecomm" dir="ltr"></div></div></div>
</div>
<div class="db"><div class="grid"><div><label>سرور MySQL</label><input id="dbServer" value="127.0.0.1"></div><div><label>پورت MySQL</label><input id="dbPort" type="number" value="3306"></div><div><label>نام کاربری</label><input id="dbUser" value="root"></div><div><label>رمز MySQL</label><input id="dbPassword" type="password"></div><div><label>نسخه MySQL</label><input id="mysqlVersion" value="8.0.0"></div></div></div>
<div class="actions"><button class="primary" onclick="runAll()">ذخیره تنظیمات و نصب انتخاب‌ها</button></div><div id="summary" class="summary"></div>
</div></div></div>
<script>
const el=id=>document.getElementById(id);function st(t,k=''){el('status').textContent=t;el('status').className='status '+k}
function targets(){let a=[];if(el('pt').checked)a.push({product:'Posiran',channel:'Test',appPort:+el('ptPort').value,databaseName:el('ptDb').value,installFolderName:'test'});if(el('pp').checked)a.push({product:'Posiran',channel:'Production',appPort:+el('ppPort').value,databaseName:el('ppDb').value,installFolderName:'production'});if(el('it').checked)a.push({product:'iMonitor',channel:'Test',appPort:+el('itPort').value,databaseName:el('itDb').value,installFolderName:'test'});if(el('ip').checked)a.push({product:'iMonitor',channel:'Production',appPort:+el('ipPort').value,databaseName:el('ipDb').value,installFolderName:'production'});return a}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await r.text();let x={};try{x=raw?JSON.parse(raw):{}}catch(_){x={detail:raw}}if(!r.ok)throw new Error(x.detail||x.error||raw||('HTTP '+r.status));return x}
async function runAll(){const ts=targets();if(!ts.length){st('حداقل یک کانال را انتخاب کنید.','warn');return}el('summary').innerHTML='';try{for(let i=0;i<ts.length;i++){const t=ts[i];st('در حال آماده‌سازی '+t.product+' '+t.channel+' ('+(i+1)+'/'+ts.length+')...');const common={...t,databaseServer:el('dbServer').value,databasePort:+el('dbPort').value,databaseUser:el('dbUser').value,databasePassword:el('dbPassword').value,mySqlVersion:el('mysqlVersion').value,autoUpdate:t.product==='Posiran'};const c=await post('/api/configure',common);st('در حال نصب '+t.product+' '+t.channel+' ('+(i+1)+'/'+ts.length+')...');const x=await post('/api/install',{product:t.product,channel:t.channel,appPort:t.appPort,installFolderName:t.installFolderName,autoUpdate:t.product==='Posiran',force:true,refreshInstaller:true});el('summary').innerHTML+=('<b>'+t.product+' '+t.channel+'</b> — <span dir=ltr>'+x.localUrl+'</span><br>')}st('همه کانال‌های انتخاب‌شده با موفقیت نصب و Health Check شدند.','ok')}catch(e){st('نصب ناموفق: '+e.message,'warn')}}
fetch('/api/status').then(r=>r.json()).then(x=>st('Windows: '+(x.isWindows?'✓':'✗')+'   Administrator: '+(x.isAdministrator?'✓':'✗')+'   IIS: '+(x.prerequisites.iis?'✓':'✗')+'   MySQL: '+(x.prerequisites.mysqlServiceDetected?'✓':'تشخیص داده نشد'),x.isAdministrator?'ok':'warn')).catch(e=>st('خطا در بررسی سیستم: '+e,'warn'));
</script></body></html>
